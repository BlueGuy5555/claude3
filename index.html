<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ThreeCraft — a Minecraft clone in Three.js</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!-- Render target -->
    <canvas id="game"></canvas>

    <!-- Crosshair -->
    <div id="crosshair">+</div>

    <!-- Heads-up display: health / hunger / hotbar -->
    <div id="hud">
      <div id="bars">
        <div id="health" class="bar"></div>
        <div id="hunger" class="bar"></div>
      </div>
      <div id="hotbar"></div>
    </div>

    <!-- Debug (F3-style) overlay -->
    <div id="debug"></div>

    <!-- Inventory / crafting / furnace overlay (hidden by default) -->
    <div id="overlay" class="hidden">
      <div id="overlay-panel"></div>
    </div>

    <!-- Start / pause menu -->
    <div id="menu">
      <div class="menu-box">
        <h1>ThreeCraft</h1>
        <p class="subtitle">A Minecraft clone built with Three.js</p>
        <div class="menu-buttons">
          <button data-mode="survival">Play — Survival</button>
          <button data-mode="creative">Play — Creative</button>
        </div>
        <div id="controls-help">
          <p><b>WASD</b> move · <b>Space</b> jump (double-tap to fly in creative) · <b>Shift</b> sneak/descend · <b>Ctrl</b> sprint</p>
          <p><b>Left-click</b> break · <b>Right-click</b> place/use · <b>Mouse wheel / 1-9</b> select · <b>E</b> inventory · <b>Q</b> drop</p>
          <p><b>F3</b> debug · <b>F5</b> toggle camera · <b>Esc</b> pause</p>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
